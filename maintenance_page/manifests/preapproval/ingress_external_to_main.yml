apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preapproval.schoolprofiles.education.gov.uk
spec:
  ingressClassName: nginx
  rules:
    - host: preapproval.schoolprofiles.education.gov.uk
      http:
        paths:
          - pathType: ImplementationSpecific
            backend:
              service:
                name: sap-public-preapproval
                port:
                  number: 80
