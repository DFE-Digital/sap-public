name: Integration Tests

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      base_url:
        required: true
        type: string

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build integration tests
        run: dotnet build Tests/SAPPub.Integration.Tests/SAPPub.IntegrationTests.csproj --configuration Release

      - name: Install Playwright browsers
        run: pwsh ./Tests/SAPPub.Integration.Tests/bin/Release/net10.0/playwright.ps1 install

      - name: Run integration tests
        env:
          HEADED: 0
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: true
          ASPNETCORE_ENVIRONMENT: CI
          BASE_URL: ${{ inputs.base_url }}
        run: |
          dotnet test Tests/SAPPub.Integration.Tests/SAPPub.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --results-directory "TestResults" \
            --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload Test Result Files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-deployment-test-results
          path: "**/TestResults/**/*"

      - name: Publish Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          reporter: dotnet-trx
          path: "**/TestResults/**/*.trx"
          name: Post Deployment Test Results