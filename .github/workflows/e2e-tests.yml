name: E2E Tests

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      base_url:
        required: true
        type: string
      test_data_version:
        required: true
        type: string

jobs:
  E2E-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build E2E tests
        run: dotnet build Tests/SAPPub.E2E.Tests/SAPPub.E2E.Tests.csproj --configuration Release

      - name: Install Playwright browsers
        run: pwsh ./Tests/SAPPub.E2E.Tests/bin/Release/net10.0/playwright.ps1 install

      - name: Run E2E tests
        env:
          HEADED: 0
          PLAYWRIGHT_IGNORE_HTTPS_ERRORS: true
          ASPNETCORE_ENVIRONMENT: CI
          BASE_URL: ${{ inputs.base_url }}
          TEST_DATA_VERSION: ${{ inputs.test_data_version }}
        run: |
          dotnet test Tests/SAPPub.E2E.Tests/SAPPub.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --results-directory "TestResults" \
            --logger "trx;LogFileName=E2E-tests.trx"

      - name: Upload E2E Test Result Files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: "**/TestResults/**/*"

      - name: Publish E2E Test Results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          reporter: dotnet-trx
          path: "**/TestResults/**/*.trx"
          name: Post Deployment Test Results